# ClaudeRegistry MCP server - reverse-proxy snippet.
#
# The MCP server runs under pm2 as a local Node process on 127.0.0.1:8787.
# Instead of a separate subdomain, it is exposed as a PATH on the existing site:
# paste this `location` block INSIDE the existing `server { ... }` block that
# already serves clauderegistry.com over HTTPS (listen 443), then:
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# No new DNS record or TLS certificate is needed - it reuses the site's existing
# certificate. `location = /mcp` (exact match) takes precedence over the static
# `location /`, so only the /mcp path is proxied; everything else stays static.

# Optional rate limiting. This zone directive must live in the http{} context
# (e.g. /etc/nginx/nginx.conf), NOT inside server{}:
#     limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;

location = /mcp {
    # limit_req zone=mcp burst=20 nodelay;   # enable if you added the zone above

    proxy_pass http://127.0.0.1:8787/mcp;
    proxy_http_version 1.1;

    # Streamable HTTP / SSE friendliness.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
}
