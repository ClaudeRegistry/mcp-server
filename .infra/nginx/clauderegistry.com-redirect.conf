# Legacy-domain redirect: clauderegistry.com -> sigistry.com (rebrand 2026-08-23).
# Badge URLs are load-bearing: third-party READMEs embed
#   https://clauderegistry.com/badge/<id>.svg
# so this domain and its cert must stay alive. 301 preserves path+query.
#
# Exception: /.well-known/mcp-registry-auth is served directly (not redirected)
# because the MCP registry key fetcher refuses redirects; this keeps the legacy
# com.clauderegistry/* registry namespace manageable.

server {
    listen 80;
    listen [::]:80;
    server_name clauderegistry.com www.clauderegistry.com;
    return 301 https://sigistry.com$request_uri;
}

server {
    listen 443 ssl;
    server_name clauderegistry.com www.clauderegistry.com;

    ssl_certificate /etc/letsencrypt/live/clauderegistry.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/clauderegistry.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location = /.well-known/mcp-registry-auth {
        alias /var/www/sigistry/mcp-registry-auth.txt;
        default_type text/plain;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    location / {
        return 301 https://sigistry.com$request_uri;
    }
}
