# Legacy-domain redirect: clauderegistry.com -> sigistry.com (post-rebrand).
#
# CRITICAL: badge URLs are load-bearing. Third-party READMEs embed
#   https://clauderegistry.com/badge/<plugin-id>.svg
# so this domain must keep answering (and its TLS cert must keep renewing)
# for as long as those embeds exist in the wild. The 301 below preserves the
# full path+query, so /badge/*.svg, /plugin/*, /verification, /mcp etc. all
# land on the same path at sigistry.com.
#
# Install: replace the old clauderegistry.com server blocks with these two,
# then `sudo nginx -t && sudo systemctl reload nginx`.
# Keep certbot renewing the clauderegistry.com cert (the 443 block needs it).

server {
    listen 80;
    listen [::]:80;
    server_name clauderegistry.com www.clauderegistry.com;
    return 301 https://sigistry.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clauderegistry.com www.clauderegistry.com;

    # Managed by certbot - paths unchanged from the original site config.
    ssl_certificate /etc/letsencrypt/live/clauderegistry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clauderegistry.com/privkey.pem;

    return 301 https://sigistry.com$request_uri;
}
