name: Deploy MCP server

# Redeploys the MCP service on the droplet on push to main.
# INERT until you opt in: set repository variable DEPLOY_ENABLED=true and the
# four secrets below (Settings -> Secrets and variables -> Actions). Until then
# this job is skipped, so it never fails a push.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}       # e.g. 167.99.114.235
          username: ${{ secrets.DEPLOY_USER }}   # e.g. root (or a deploy user)
          key: ${{ secrets.DEPLOY_SSH_KEY }}     # a private key whose public key is in the box's authorized_keys
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"       # e.g. /opt/clauderegistry-mcp
            git fetch --prune origin
            git reset --hard origin/main
            npm ci --omit=dev
            sudo systemctl restart clauderegistry-mcp
            sleep 2
            curl -fsS http://127.0.0.1:8787/health
